name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pytest numpy onnxruntime
      # Pure-Python tests: config loader, cost calculator, MLP weights lookup and
      # passthrough, and the tools. No ROS needed.
      - run: pytest

  build:
    runs-on: ubuntu-24.04
    container: ubuntu:noble
    env:
      # pip inside the noble container refuses system-wide installs without this.
      PIP_BREAK_SYSTEM_PACKAGES: "1"
    steps:
      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy
      - uses: actions/checkout@v7
      - uses: ros-tooling/action-ros-ci@v0.4
        with:
          target-ros2-distro: jazzy
          # Builds every package below and its in-repo dependencies, which brings in
          # ego_planner through cine_bringup. Naming ego_planner here would also test
          # it, because the action passes this list to `colcon test --packages-select`
          # over colcon-defaults, and third_party/ fails the ament linters upstream.
          colcon-defaults: |
            {
              "test": {
                "packages-select": [
                  "cine_msgs",
                  "cine_config",
                  "cine_agent",
                  "cine_depth",
                  "cine_mlp_correction",
                  "cine_bringup"
                ]
              }
            }
          package-name: >-
            cine_msgs
            cine_config
            cine_agent
            cine_depth
            cine_mlp_correction
            cine_bringup
