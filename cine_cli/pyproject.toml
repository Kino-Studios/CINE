[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cine-cli"
version = "0.1.0"
description = "Command-line front end for the CINE ground-PC scripts and launch files"
requires-python = ">=3.12"
dependencies = ["typer>=0.29.1,<0.30"]

[project.scripts]
cine = "cine_cli.main:app"

[tool.setuptools]
packages = ["cine_cli"]
