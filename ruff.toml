line-length = 100
target-version = "py312"

extend-exclude = [
    "third_party",
    "venv",
    ".venv",
]

[format]
quote-style = "single"

[lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",   # line length handled by formatter
    "E402",   # test_cost_calculator stubs rclpy in sys.modules before importing the code under test
    "F841",   # unused locals in the cost and path code; deleting them is a logic edit, left for review
    "B905",   # zip(strict=True) would raise where the code now truncates; a behaviour change
]
