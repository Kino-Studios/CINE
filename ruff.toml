line-length = 100
target-version = "py310"

extend-exclude = [
    "trajectory-optimization_ws/src/ego-planner-swarm",
    "venv",
    ".venv",
    "trajectory-optimization_ws/install",
    "trajectory-optimization_ws/build",
    "trajectory-optimization_ws/log",
    "scripts/install",
    "scripts/build",
    "install",
    "build",
]

[lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",   # line length handled by formatter
    "E402",   # module-level import not at top: legitimate for sys.path / matplotlib.use() patterns
    "F841",   # local variable assigned but never used: plot handles kept for API symmetry
    "E741",   # ambiguous variable name: tolerate single-letter loop vars in viz scripts
]
