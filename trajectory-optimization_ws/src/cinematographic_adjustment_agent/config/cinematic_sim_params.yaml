cinematic_waypoint_generator:
  ros__parameters:
    frame_id: world
    output_topic: /move_base_simple/goal
    odom_topic: /drone_0_visual_slam/odom
    detections_topic: /object_detections
    light_vector_topic: /cinematography/light_vector
    enable_cost_optimization: true
    light_avoidance_enabled: true
    light_avoidance_gain: 2.5
    light_influence_distance_m: 4.0
    use_dynamic_waypoints_on_detection: true
    candidate_angle_window_rad: 0.6
    candidate_angle_samples: 7
    candidate_radius_samples: 5
    candidate_radius_scale_range: [0.7, 1.3]
    waypoint_lookahead: 2
    dynamic_waypoint_lookahead: 3
    distance_threshold_m: 0.5
    progress_timeout_s: 4.0
    min_goal_distance_m: 0.5
    min_first_waypoint_distance_m: 0.5
    enable_progress_skip: false
    image_width: 1152
    image_height: 648
    camera_fx: 387.229248046875
    camera_fy: 387.229248046875
    camera_cx: 320.5
    camera_cy: 240.5
    orbit_altitude_m: 1.5
    min_altitude_m: 0.2
    max_altitude_m: 3.0
    min_orbit_radius_m: 0.2
    waypoint_radius_m: 0.13
    max_waypoint_jump_m: 3.0
    min_waypoint_separation_m: 0.5
    bezier_blend_length_m: 0.1
    bezier_transition_points: 6
    bezier_min_speed_mps: 0.05
    focus_distance_m: 1.0
    focus_distance_tolerance_m: 0.05
    focus_altitude_m: -1.0
    anchor_start_index: -1
    anchor_end_index: -1
    anchor_index_window: 2
    anchor_min_gap: 2
    arc_waypoint_spacing_m: 1.0
    anchor_marker_scale_m: 0.28
    target_marker_scale_m: 0.32
    waypoint_xy_scale: 1.1
    waypoint_y_extra_scale: 1.05
    waypoint_z_scale: 1.1
    enable_z_clamp: false
    z_ceiling_override_m: -1.0
    world_bounds_min: [-10.0, -10.0, 0.0]
    world_bounds_max: [10.0, 10.0, 2.8]
    virtual_ceiling_m: 2.8
    simulate_fake_object: false
    fake_object_world_offset: [0.3, 0.6, 0.0]
    fake_object_side_offset_m: 0.6
    fake_object_radius_m: 0.8
    fake_object_outward_offset_m: 1.0
