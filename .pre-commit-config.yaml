# Hooks for first-party code only: everything under third_party/ keeps its upstream form.
# Versions are tags confirmed with `gh api` on 2026-10-19. ruff is pinned to the version the
# tree was last formatted with (0.15.14), not the latest release (v0.17.1); move both together.
exclude: ^third_party/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=10240]
      - id: check-xml
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell

  - repo: local
    hooks:
      - id: whitespace-convention
        name: whitespace convention (tools/format.py --check)
        entry: python3 tools/format.py --check
        language: system
        types: [python]
